name: Deploy ATW Frontend DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atw-frontend-dev
  cancel-in-progress: false

jobs:
  build_push:
    name: Build and push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build React with public settings
        uses: ./.github/actions/frontend-tasks
        env:
          # Existing source has lint warnings; keep them visible without failing DEV.
          # Compilation errors still fail. Remove this override after fixing warnings.
          CI: 'false'
        with:
          operation: build-react
          app_config_endpoint: ${{ vars.APP_CONFIG_ENDPOINT }}
          config_label: dev

      - name: Login to ACR
        uses: ./.github/actions/frontend-tasks
        with:
          operation: acr-login
          acr_name: ${{ vars.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/atw-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy
    needs: build_push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend
        uses: ./.github/actions/frontend-tasks
        with:
          operation: deploy
          app_name: ${{ vars.FRONTEND_APP_NAME }}
          resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/atw-frontend:${{ needs.build_push.outputs.image_tag }}
          runtime_identity_resource_id: ${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}
